                "schema": {
                  "type": "string",
                  "format": "uuid"
                },
                "description": "Request correlation, never private content"
              },
              "Cache-Control": {
                "schema": {
                  "type": "string"
                },
                "description": "no-store for all private responses"
              },
              "ETag": {
                "required": true,
                "schema": {
                  "type": "string",
                  "pattern": "^\"[0-9a-fA-F-]{36}\"$"
