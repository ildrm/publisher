    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 128
        },
        "description": "Actor+operation+resource scoped. Authenticate and check current resource permission before exposing a receipt. Once authorized, same key and request hash returns original result; changed body gives 409. Proposed 7-day receipt window; reconcile uncertain outcomes after expiry. Financial and provider deduplication require separate durable business keys."
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\"[0-9a-fA-F-]{36}\"$"
        },
        "description": "Quoted current revision/version UUID; stale state returns 412."
      },
      "IfMatchEdition": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\"[A-Za-z0-9_-]{1,128}\"$"
        },
        "description": "Strong opaque ETag returned by getEdition; stale state returns 412."
      },
