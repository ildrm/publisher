    "/v1/chapters/{chapterId}": {
      "put": {
        "operationId": "saveChapter",
        "summary": "saveChapter",
        "description": "Authenticate and authorize current project access before revealing any idempotency receipt. For an authorized actor, replay the same key and request before checking a stale base; commit revision and receipt durably before acknowledging. A response arriving after revocation can represent a transaction committed before revocation.",
        "tags": [
          "chapter:write"
        ],
        "x-requirements": [
          "FR-DOC-002"
        ],
        "x-required-permission": "chapter:write",
        "x-audience": "internal authenticated web API",
